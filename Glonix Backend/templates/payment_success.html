<!-- templates/payment_success.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Payment Confirmation - Glonix</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f9f9f9;
            text-align: center;
            padding: 40px;
        }
        .container {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            display: inline-block;
        }
        img {
            height: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #4CAF50;
        }
        p {
            font-size: 16px;
            color: #333;
        }
        .info {
            margin-top: 20px;
            text-align: left;
        }
        .info strong {
            display: inline-block;
            width: 120px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Glonix Logo">
        <h1>🎉 Payment Successful!</h1>
        <p>Thank you for your payment. Here are the details:</p>

        <div class="info">
            <p><strong>Name:</strong> {{ name }}</p>
            <p><strong>Email:</strong> {{ email }}</p>
            <p><strong>Amount:</strong> ₹{{ amount }}</p>
        </div>
    </div>
</body>
</html>
